name: Сборка AmneziaWG для Challenger SE

on:
  release:
    types: [published]

jobs:
  build:
    name: Сборка пакетов
    runs-on: ubuntu-latest
    steps:
      - name: Развертывание OpenWrt SDK
        uses: openwrt/gh-action-sdk@v1
        env:
          ARCH: mediatek-filogic
          FEEDNAME: amneziawg
          PACKAGES: kmod-amneziawg amneziawg-tools luci-proto-amneziawg
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          INDEX: 1

      - name: Сборка модулей
        run: |
          git clone https://github.com package/amneziawg
          make package/amneziawg/compile V=s

      - name: Загрузка артефактов в Релиз
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/packages/aarch64_cortex-a53/amneziawg/*.apk
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
